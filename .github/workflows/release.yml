# Builds, tests and publishes a release. Start it from GitHub: Actions → Release → Run workflow
# (it releases the version in internal/app/app.go), or by pushing a version tag like v1.2.3.
# The release description comes from that version's section in CHANGELOG.md
# (falling back to the commit messages since the previous release).
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Work out the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep -oP 'const Version = "\K[^"]+' internal/app/app.go)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Version \"$ver\" in internal/app/app.go"
            exit 1
          fi
          if gh release view "v$ver" >/dev/null 2>&1; then
            echo "::error::v$ver is already released — bump Version in internal/app/app.go first"
            exit 1
          fi
          echo "VER=$ver" >> "$GITHUB_ENV"

      - name: Test
        run: go test ./...

      - name: Build RustWatch.exe
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui" -o dist/RustWatch.exe ./cmd/rustwatch
          (cd dist && sha256sum RustWatch.exe > RustWatch.exe.sha256)
          cat dist/RustWatch.exe.sha256

      - name: Write release notes
        run: |
          ver="$VER"
          awk -v v="## v$ver" '$0 ~ "^## " { if (found) exit; if (index($0, v) == 1) { found = 1; next } } found' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            range="${prev:+$prev..}HEAD"
            git log --no-merges --pretty='- %s' "$range" > notes.md
          fi
          {
            echo
            echo "---"
            echo "**Update:** RustWatch offers this in **Settings → Updates** (or the banner at the top). **New install:** download \`RustWatch.exe\` below and double-click it."
            echo
            echo "SHA-256 of RustWatch.exe: \`$(cut -d' ' -f1 dist/RustWatch.exe.sha256)\`"
          } >> notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VER" dist/RustWatch.exe dist/RustWatch.exe.sha256 \
            --target "$GITHUB_SHA" --title "RustWatch $VER" --notes-file notes.md
